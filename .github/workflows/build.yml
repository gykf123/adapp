name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle（含缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 检查产物
        id: check
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::未找到 $APK"
            find app/build/outputs -name "*.apk" || true
            exit 1
          fi
          ls -lh "$APK"
          # 重命名带上短 commit，便于区分版本
          OUT="FeSui-adapp-${GITHUB_SHA::7}.apk"
          cp "$APK" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: FeSui-adapp-apk-${{ github.sha }}
          path: ${{ steps.check.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      # 打 tag（形如 v1.0.0）或手动触发时可额外产出 Release
      - name: 创建 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.check.outputs.apk }}
          generate_release_notes: true
